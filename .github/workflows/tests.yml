name: Validar geometría
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas de geometría y SVG
        run: python -m unittest discover -s tests -v
      - name: Sintaxis Python
        run: python -m compileall -q freecad tests
